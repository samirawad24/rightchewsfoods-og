<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save the Date — Cooper & Marisa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&family=Cinzel:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #f8f2e6;
      --ivory:    #faf6ee;
      --gold:     #c9a84c;
      --gold-lt:  #e2c97e;
      --blush:    #e8b4b8;
      --rose:     #c97d84;
      --deep-rose:#9b4a52;
      --sage:     #7a9e7e;
      --sage-dk:  #4f7253;
      --wax:      #8b1a1a;
      --wax-dk:   #5c1010;
      --bg-dark:  #1a1410;
      --bg-mid:   #241c16;
    }

    html, body {
      height: 100%;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow: hidden;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 55%, rgba(201,168,76,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .scene {
      position: relative;
      width: 460px;
      perspective: 1400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .envelope-wrapper {
      position: relative;
      width: 460px;
      height: 300px;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(170deg, #ede5d0 0%, #f5ecd8 40%, #ede5d0 100%);
      border-radius: 4px 4px 6px 6px;
      box-shadow:
        0 8px 40px rgba(0,0,0,0.55),
        0 2px 8px  rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.3);
      overflow: hidden;
    }

    .envelope-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #f0e8d0 0%, #ede2c4 100%);
    }

    .envelope-body::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: linear-gradient(155deg, transparent 49.5%, #ddd0b0 49.5%, #ddd0b0 50.5%, transparent 50.5%),
                  linear-gradient(205deg, transparent 49.5%, #ddd0b0 49.5%, #ddd0b0 50.5%, transparent 50.5%);
    }

    .envelope-side-left,
    .envelope-side-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 230px;
      pointer-events: none;
      z-index: 1;
    }
    .envelope-side-left {
      left: 0;
      background: linear-gradient(135deg, transparent 49%, #d8ccb0 49%, #d8ccb0 51%, transparent 51%);
    }
    .envelope-side-right {
      right: 0;
      background: linear-gradient(225deg, transparent 49%, #d8ccb0 49%, #d8ccb0 51%, transparent 51%);
    }

    .card-container {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 10px;
      top: 20px;
      z-index: 2;
      overflow: hidden;
    }

    .card {
      position: absolute;
      inset: 0;
      background: var(--ivory);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 0s;
      opacity: 0;
      border: 1px solid rgba(201,168,76,0.25);
    }

    .card.revealed {
      transform: translateY(0%);
      opacity: 1;
      transition: transform 0.9s cubic-bezier(0.34,1.05,0.64,1) 0.1s,
                  opacity 0.3s ease 0.1s;
    }

    .card-top-flowers { width: 100%; height: 60px; position: relative; flex-shrink: 0; }
    .card-bottom-flowers { width: 100%; height: 60px; position: relative; flex-shrink: 0; }

    .card-inner {
      text-align: center;
      padding: 4px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .card-save {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .card-the-date {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .card-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 4px auto;
    }

    .card-names {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: #3a2a1a;
      line-height: 1;
      margin: 2px 0;
    }

    .card-ampersand {
      font-family: 'Great Vibes', cursive;
      font-size: 30px;
      color: var(--rose);
      display: block;
      line-height: 1;
    }

    .card-date-line {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #5a4030;
      margin-top: 4px;
    }

    .card-year {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.35em;
      color: var(--gold);
    }

    .card-more {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 9.5px;
      letter-spacing: 0.1em;
      color: #9a8060;
      margin-top: 4px;
    }

    .envelope-flap-wrap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 160px;
      transform-style: preserve-3d;
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.0s;
      z-index: 10;
      cursor: pointer;
    }

    .envelope-flap-face {
      position: absolute;
      inset: 0;
      background: linear-gradient(175deg, #ede5cf 0%, #e8dcbf 60%, #ddd0b0 100%);
      clip-path: polygon(0% 0%, 100% 0%, 50% 88%);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .envelope-flap-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(175deg, #e8e0cc 0%, #ddd4b8 100%);
      clip-path: polygon(0% 0%, 100% 0%, 50% 88%);
      transform: rotateX(180deg);
      backface-visibility: visible;
    }

    .wax-seal {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      z-index: 20;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .wax-seal svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    }

    .wax-seal.cracking {
      animation: sealCrack 0.5s ease-in-out forwards;
    }
    .wax-seal.cracked {
      opacity: 0;
      transform: translateX(-50%) scale(1.2) rotate(10deg);
    }

    @keyframes sealCrack {
      0%   { transform: translateX(-50%) scale(1)    rotate(0deg); }
      25%  { transform: translateX(-50%) scale(1.05) rotate(-3deg); }
      50%  { transform: translateX(-50%) scale(0.95) rotate(4deg); }
      75%  { transform: translateX(-50%) scale(1.08) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.15) rotate(6deg); opacity: 0.4; }
    }

    .state-1 .envelope-flap-wrap {
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      transform: rotateX(-60deg);
    }

    .state-2 .envelope-flap-wrap {
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      transform: rotateX(-180deg);
    }

    .state-3 .envelope-flap-wrap {
      transform: rotateX(-180deg);
    }

    .click-prompt {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: rgba(201,168,76,0.7);
      text-align: center;
      transition: opacity 0.5s ease;
      height: 24px;
    }
    .click-prompt.hidden { opacity: 0; pointer-events: none; }

    .arrow {
      display: inline-block;
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }

    .petal {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      animation: petalFall linear infinite;
    }

    @keyframes petalFall {
      0%   { transform: translateY(-40px) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    .flower-corner {
      position: absolute;
    }
  </style>
</head>

<script>
  let state = 0;
  const wrapper = document.getElementById('envelopeWrapper');
  const seal    = document.getElementById('waxSeal');
  const card    = document.getElementById('card');
  const prompt  = document.getElementById('clickPrompt');

  const prompts = [
    '<span class="arrow">↑</span>&ensp;Click to open&ensp;<span class="arrow">↑</span>',
    'Click again…',
    'One more time…',
    '',
  ];

  function handleClick() {
    if (state >= 3) return;
    state++;

    if (state === 1) {
      seal.classList.add('cracking');
      setTimeout(() => seal.classList.add('cracked'), 500);
      setTimeout(() => { wrapper.classList.add('state-1'); }, 350);
    }
    if (state === 2) {
      wrapper.classList.remove('state-1');
      wrapper.classList.add('state-2');
    }
    if (state === 3) {
      wrapper.classList.add('state-3');
      setTimeout(() => { card.classList.add('revealed'); spawnPetals(); }, 200);
    }

    prompt.innerHTML = prompts[state] || '';
    if (state >= 3) prompt.classList.add('hidden');
  }

  wrapper.addEventListener('click', handleClick);

  const petalColors = ['#e8b4b8','#f0c8cc','#dda0a5','#f8d8da','#e2c97e','#f5e8c0'];
  const petalShapes = [
    'M0,-8 C4,-8 8,-4 8,0 C8,4 4,8 0,8 C-4,8 -8,4 -8,0 C-8,-4 -4,-8 0,-8 Z',
    'M0,-10 C6,-8 8,0 4,8 C0,10 -4,8 -8,0 C-8,-6 -4,-10 0,-10 Z',
    'M0,-6 C3,-6 6,-2 5,3 C4,7 0,8 -2,6 C-5,3 -6,-1 -4,-5 Z',
  ];

  function spawnPetals() {
    for (let i = 0; i < 30; i++) {
      setTimeout(() => createPetal(), i * 150 + Math.random() * 200);
    }
  }

  function createPetal() {
    const el = document.createElement('div');
    el.className = 'petal';
    const size = 8 + Math.random() * 12;
    const left = Math.random() * 100;
    const dur  = 4 + Math.random() * 5;
    const delay = Math.random() * 1;
    const color = petalColors[Math.floor(Math.random() * petalColors.length)];
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="-10 -10 20 20"><path d="${petalShapes[Math.floor(Math.random()*petalShapes.length)]}" fill="${color}" opacity="0.75"/></svg>`;
    el.style.cssText = `left:${left}%;top:-20px;animation-duration:${dur}s;animation-delay:${delay}s;animation-name:petalFall;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay + 0.5) * 1000);
  }

  (function ambientPetals() {
    function drop() {
      const el = document.createElement('div');
      el.className = 'petal';
      const size = 6 + Math.random() * 8;
      const left = Math.random() * 100;
      const dur  = 7 + Math.random() * 6;
      const color = petalColors[Math.floor(Math.random() * petalColors.length)];
      el.innerHTML = `<svg width="${size}" height="${size}" viewBox="-10 -10 20 20"><path d="${petalShapes[Math.floor(Math.random()*petalShapes.length)]}" fill="${color}" opacity="0.5"/></svg>`;
      el.style.cssText = `left:${left}%;top:-20px;animation-duration:${dur}s;animation-delay:0s;animation-name:petalFall;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), (dur + 0.5) * 1000);
    }
    drop();
    setInterval(drop, 2200);
  })();
</script>
</body>
